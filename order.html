<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- site_build: 최신 확인 -->
<meta name="build" content="edf69a641c87">
<script>/* 예전 화면 방지 (site_build.py 가 관리 · 손으로 고치지 마세요): 서버의 최신 빌드와 다르면 한 번 새로 불러온다 */
(function () {
  var mine = document.querySelector('meta[name="build"]').content;
  fetch("version.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (v) {
    if (!v.build || v.build === mine) return;
    var u = new URL(location.href);
    if (u.searchParams.get("_b") === v.build) return;  // 새로 불렀는데도 다르면 반복하지 않는다
    u.searchParams.set("_b", v.build);
    location.replace(u.toString());
  }).catch(function () {});
})();
</script>
<title>주문하기 · {brand}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=b974501cd2">
<script src="js/config.js?v=78c5e0f0bb"></script>
<script src="vendor/lunar.js?v=9750324bfe"></script>
<script src="js/saju-lite.js?v=ed687ce6ce"></script>
<script src="js/site.js?v=39029ff7ec"></script>
<script src="js/order.js?v=ab97b19c59"></script>
</head>
<body>
<div class="layout">
<aside id="side" class="side"></aside>
<div class="app">
<div id="testbanner" class="testbanner" hidden>테스트 모드: 주문이 실제로 전송되지 않습니다 (config.js 의 orderEndpoint 를 채우면 실제 접수)</div>
<header class="top"><div class="wrap">
  <a class="logo" href="index.html" data-brand></a>
  <a class="btn small ghost" href="index.html#free">무료 운세</a>
</div></header>

<main><section><div class="wrap">
  <div id="order-view">
    <h2>분석지 주문하기</h2>
    <p class="sub">입금이 확인되면 24시간 안에 이메일로 PDF 분석지를 보내 드립니다.</p>

    <form id="o-form" novalidate>
      <fieldset><legend>상품</legend>
        <div class="grid" id="o-products"></div>
      </fieldset>

      <fieldset><legend>본인 정보</legend>
        <div class="row two" style="margin-bottom:12px">
          <div><label for="o-name">이름 <span class="hint">(분석지 표지에 들어갑니다)</span></label><input type="text" id="o-name" maxlength="20" autocomplete="name"></div>
          <div><label>성별</label><div class="seg">
            <label><input type="radio" name="o-gender" value="여"><span>여</span></label>
            <label><input type="radio" name="o-gender" value="남"><span>남</span></label></div></div>
        </div>
        <div style="margin-bottom:12px"><label>달력</label><div class="seg">
          <label><input type="radio" name="o-cal" value="양력" checked><span>양력</span></label>
          <label><input type="radio" name="o-cal" value="음력"><span>음력</span></label>
          <label><input type="radio" name="o-cal" value="윤달"><span>음력 윤달</span></label></div></div>
        <div class="row two" style="margin-bottom:8px">
          <div><label for="o-y">생년월일</label><div class="row three date3" data-date="o"><select id="o-y" aria-label="년"></select><select id="o-m" aria-label="월"></select><select id="o-d" aria-label="일"></select></div></div>
          <div><label for="o-time">태어난 시간</label><input type="time" id="o-time"></div>
        </div>
        <label class="check"><input type="checkbox" id="o-unknown"> 태어난 시간을 몰라요</label>
        <div style="margin-top:12px"><label for="o-place">태어난 곳 <span class="hint">(선택 · 고르면 그 지역 경도로 출생 시간을 보정합니다)</span></label><select id="o-place"></select></div>
      </fieldset>

      <fieldset id="o-dream-box" hidden><legend>꿈 이야기</legend>
        <label for="o-dream">어떤 꿈이었나요? <span class="hint">(장면, 등장한 것, 느낌을 자유롭게 · 20~1,000자)</span></label>
        <textarea id="o-dream" maxlength="1000" placeholder="예) 큰 구렁이가 집 안으로 들어와 내 발목을 감았는데 이상하게 무섭지 않았다."></textarea>
        <div style="margin-top:12px"><label for="o-dream-date">꿈 꾼 날</label><input type="date" id="o-dream-date"></div>
      </fieldset>

      <fieldset id="o-concern-box" hidden><legend>고민 <span class="hint">(선택)</span></legend>
        <label for="o-concern">지금 가장 궁금한 것을 적어 주세요 <span class="hint">(500자까지 · 적어 주시면 그 답을 중심으로 풉니다)</span></label>
        <textarea id="o-concern" maxlength="500"></textarea>
      </fieldset>

      <fieldset id="o-family-box" hidden><legend id="o-family-legend">함께 볼 사람 <span class="hint">(최대 4명)</span></legend>
        <div id="o-family" class="grid"></div>
        <button type="button" class="btn ghost small" id="o-add" style="margin-top:10px">+ 사람 추가</button>
      </fieldset>

      <fieldset><legend>받으실 곳</legend>
        <div class="row two">
          <div><label for="o-email">이메일 <span class="hint">(분석지를 받을 주소)</span></label><input type="email" id="o-email" autocomplete="email" inputmode="email"></div>
          <div><label for="o-phone">휴대폰 <span class="hint">(선택 · 입금 확인 연락용)</span></label><input type="tel" id="o-phone" autocomplete="tel" inputmode="tel" maxlength="13"></div>
        </div>
        <div style="margin-top:12px"><label for="o-depositor">입금자명 <span class="hint">(주문자와 다르면 꼭 적어 주세요)</span></label><input type="text" id="o-depositor" maxlength="20"></div>
        <input type="text" id="o-website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      </fieldset>

      <fieldset><legend>동의</legend>
        <label class="check"><input type="checkbox" id="o-agree-privacy"> <span>[필수] 개인정보 수집·이용에 동의합니다. 이름·생년월일·출생시간·성별·이메일·휴대폰·입금자명과 적어 주신 경우 출생지·고민 글(가족 궁합·연애운은 함께 볼 분의 생년월일 포함)을 분석지 제작과 발송에만 쓰고, 발송 후 90일 뒤 지웁니다. <a href="policy.html#privacy" target="_blank">자세히</a></span></label>
        <label class="check" style="margin-top:8px"><input type="checkbox" id="o-agree-refund"> <span>[필수] 분석지를 보내 드린 뒤에는 디지털 콘텐츠 특성상 환불이 어렵다는 것을 확인했습니다. <a href="policy.html#refund" target="_blank">환불 규정</a></span></label>
        <label class="check" style="margin-top:8px"><input type="checkbox" id="o-agree-family" hidden> <span id="o-agree-family-text" hidden>[필수] 함께 볼 분에게 생년월일 정보를 쓰는 것에 대해 알리고 동의를 받았습니다.</span></label>
      </fieldset>

      <div class="total"><span id="o-sel">상품을 골라 주세요</span><b id="o-price"></b></div>
      <div id="o-error" class="error" role="alert"></div>
      <button class="btn" id="o-submit" type="submit" style="width:100%">주문하고 입금 안내 받기</button>
    </form>
  </div>

  <div id="done-view" hidden></div>
</div></section></main>

<footer id="footer"></footer>
</div>
</div>
</body>
</html>
